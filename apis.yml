aid: unitedmasters
name: UnitedMasters
description: UnitedMasters is an independent music distribution platform founded by
  Steve Stoute in 2017 and backed by Alphabet, Andreessen Horowitz (a16z), and Apple.
  Artists distribute music to 150+ streaming services while keeping full ownership
  of their master recordings, with real-time royalty payouts, Blueprint AI artist
  development tools, analytics, and brand and sync licensing partnerships with the
  NBA, ESPN, TikTok, and other major brands. UnitedMasters does not currently publish
  a public developer API, SDKs, or API documentation.
